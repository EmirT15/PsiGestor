<h2>Crear disponibilidad</h2>

<form [formGroup]="availabilityForm" (ngSubmit)="submit()">

  <label for="date">Fecha</label>
  <input
    id="date"
    type="date"
    formControlName="date"
  />

  <label for="startTime">Hora de inicio</label>
  <input
    id="startTime"
    type="time"
    formControlName="startTime"
  />

  <label for="endTime">Hora de fin</label>
  <input
    id="endTime"
    type="time"
    formControlName="endTime"
  />

  <label for="duration">Duración (minutos)</label>
  <input
    id="duration"
    type="number"
    formControlName="duration"
  />

  <label for="breakTime">Descanso (minutos)</label>
  <input
    id="breakTime"
    type="number"
    formControlName="breakTime"
  />

  @if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

  <button type="submit" [disabled]="availabilityForm.invalid">
  Crear disponibilidad
</button>

</form>
