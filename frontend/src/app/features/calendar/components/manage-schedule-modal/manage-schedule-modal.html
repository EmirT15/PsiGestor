<div
  class="modal-backdrop"
  (click)="close()"
>

  <section
    class="schedule-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="schedule-modal-title"
    (click)="$event.stopPropagation()"
  >

    <!-- Encabezado -->
    <header class="modal-header">

      <div class="modal-heading">

        <div class="modal-icon">
          ◷
        </div>

        <div>

          <h2 id="schedule-modal-title">
            Gestionar Horarios de Atención
          </h2>

          <p>
            Configura tus rangos de atención y administra los cambios de tu agenda
          </p>

        </div>

      </div>


      <button
        type="button"
        class="close-button"
        aria-label="Cerrar"
        (click)="close()"
      >
        ×
      </button>

    </header>


    <!-- Pestañas -->
    <nav
      class="schedule-tabs"
      aria-label="Opciones de gestión de horario"
    >

      <button
        type="button"
        [class.active]="activeTab === 'regular'"
        (click)="selectTab('regular')"
      >
        Horario habitual
      </button>


      <button
        type="button"
        [class.active]="activeTab === 'disabled'"
        (click)="selectTab('disabled')"
      >
        Horarios inhabilitados
      </button>

    </nav>


    <!-- Contenido -->
    <main class="modal-content">

      @if (activeTab === 'regular') {

        <section class="tab-workspace">

          @if (isLoadingRegularSchedule) {

  <p>
    Cargando horario habitual...
  </p>

} @else if (loadError) {

  <p>
    {{ loadError }}
  </p>

} @else {

  <app-regular-schedule
    [initialConfig]="regularScheduleConfig"
    (scheduleSaved)="handleRegularScheduleSaved($event)"
    (cancelRequested)="close()"
  />

}

        </section>

      }


      @if (activeTab === 'disabled') {

        <section class="tab-workspace">

          <!--
            HU-02B
            Espacio reservado para los componentes
            desarrollados por Emir.
          -->

          <app-disabled-schedules-list />

        </section>

      }

    </main>

  </section>

</div>
