services:

  frontend:
    build: ./frontend
    container_name: psigestor_frontend
    ports:
      - "4200:4200"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: psigestor_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: psigestor_postgres
    environment:
      POSTGRES_DB: psigestor_db
      POSTGRES_USER: psigestor_user
      POSTGRES_PASSWORD: psigestor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: